<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - W8</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4 registration-card">
            <h2 class="text-center mb-4 text-primary fw-bold">Tech-Summit 2026</h2>
            <p class="text-center text-muted mb-4">Register now to secure your spot!</p>

            <!-- Bootstrap Validation: 'needs-validation' + 'novalidate' -->
            <form id="eventForm" class="needs-validation" novalidate>
                
                <!-- Floating Label: Full Name -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="fName" placeholder="John Doe" required>
                    <label for="fName">Full Name</label>
                    <div class="invalid-feedback">Please enter your name.</div>
                </div>

                <!-- Floating Label: Email -->
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="fEmail" placeholder="name@example.com" required>
                    <label for="fEmail">Email Address</label>
                    <div class="invalid-feedback">Enter a valid email.</div>
                </div>

                <!-- Select Menu: Event Category -->
                <div class="form-floating mb-3">
                    <select class="form-select" id="fEvent" required>
                        <option value="" selected disabled>Choose...</option>
                        <option value="1">Web Development</option>
                        <option value="2">AI & Machine Learning</option>
                        <option value="3">Cyber Security</option>
                    </select>
                    <label for="fEvent">Event Category</label>
                </div>

                <!-- Tooltip Example: On the checkbox label -->
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="fTerms" required>
                    <label class="form-check-label" for="fTerms" 
                           data-bs-toggle="tooltip" 
                           data-bs-placement="right" 
                           title="You must agree to enter the event.">
                        I agree to terms and conditions
                    </label>
                    <div class="invalid-feedback">Check this to proceed.</div>
                </div>

                <!-- Submit Button with Tooltip -->
                <button class="btn btn-primary w-100 py-2 fw-bold" 
                        type="submit" 
                        data-bs-toggle="tooltip"
                        title="Click to register!">
                    Confirm Registration
                </button>
            </form>
        </div>
    </div>

    <!-- Offline Bootstrap Bundle JS (Required for Tooltips) -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
