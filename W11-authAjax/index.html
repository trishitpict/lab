<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W11 - User Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Section 1: Registration Form -->
        <div class="auth-card">
            <h2>User Registration</h2>
            <form id="registrationForm">
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="password" id="regPass" placeholder="Create Password" required>
                <input type="text" id="regMobile" placeholder="Mobile (10 digits)" required>
                <label class="date-label">Date of Birth:</label>
                <input type="date" id="regDob" required>
                <input type="text" id="regCity" placeholder="City" required>
                <textarea id="regAddress" placeholder="Full Address" rows="3" required></textarea>
                
                <button type="button" class="btn-reg" onclick="handleRegister()">Register (AJAX POST)</button>
            </form>
        </div>

        <!-- Section 2: Login Form -->
        <div class="auth-card">
            <h2>User Login</h2>
            <form id="loginForm">
                <input type="email" id="loginUser" placeholder="Email Address" required>
                <input type="password" id="loginPass" placeholder="Password" required>
                
                <button type="button" class="btn-login" onclick="handleLogin()">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
